# DECO adapted to the ManiSkill-ViTac 2026 / official LeRobot data contract -- vision +
# tactile ("vitac") variant. Stage 2 of DECO's own two-stage recipe: freezes the
# vision-only backbone trained by config/deco_vitac2026_vis.yaml and only trains the new
# tactile image encoder + tactile cross-attention + PI_Adapter (LoRA) params
# (see models/deco_vitac/deco_vitac.py's `modeling()` pretrain_model_path/plugin branch).
model_name: deco_vitac
data_format: lerobot

model:
  action_dim: 20
  obs_dim: 20
  chunk_size: 32
  obs_state: True
  use_tactile: True
  plugin: True                # decoupled LoRA-rank adapter injection, not joint/coupled fusion
  plugin_rank: 32
  use_language_condition: True
  lang_embed_dim: 384
  tactile_pool_size: 2         # per-sensor spatial tokens = pool_size**2; 4 sensors -> 16 tactile tokens total (t_hist=1)
  tactile_t_hist: 1            # bump to 2 (current + previous frame) later if contact dynamics matter -- see PDF 7.2
  num_attn_blocks: 6
  inf_step: 5
  heads: 8
  dim: 512
  rope_axes_dim: [256, 256]
  img_pretrain: /root/.cache/torch/hub/checkpoints/resnet34-b627a593.pth
  freeze_backbone: False       # irrelevant here: img_encoder weights come from pretrain_model_path below, not img_pretrain
  # Fill in after stage 1 (deco_vitac2026_vis) has trained -- e.g. ./logs/log_deco_vitac_vis/best.pth
  pretrain_model_path: false
  adapter_model_path: False    # set to a saved adapter checkpoint for inference-only loading

dataset:
  repo_id: KaiyueChen/black_smash_03
  root: /root/.cache/huggingface/lerobot/KaiyueChen/black_smash_03
  val_ratio: 0.1
  split_seed: 42
  lang_embed_cache: ./assets/lang_embeddings/black_smash_03.json

data:
  chunk_size: 32
  norm_type: mean_std
  # Whole-stream tactile dropout (PDF 7.3): forces the policy to keep using vision instead
  # of only relying on tactile once it's available. Validate with tactile zero/shuffle runs.
  tactile_dropout: 0.15
  # Real stats from the full 450/500-episode train split, identical to
  # deco_vitac2026_vis.yaml (kept in sync so stage-2 fine-tuning sees the same
  # normalization the stage-1 backbone was trained on) -- NOT the 5-episode smoke placeholder.
  observation_mean: [-0.06947644054889679, 0.11308970302343369, -0.01884806714951992, -0.1543254554271698, 0.06768804043531418, -0.30647602677345276, 0.10078930854797363, 0.04559728503227234, 0.058093998581171036, -0.007973733358085155, 0.0744992345571518, 0.04396196827292442, 0.23458705842494965, 0.1012437641620636, 0.1796698123216629, 0.24749483168125153, 0.02726856619119644, -0.2046532928943634, -0.4942851662635803, 1.6411638259887695]
