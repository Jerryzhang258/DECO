# DECO adapted to the ManiSkill-ViTac 2026 / official LeRobot data contract -- vision-only
# (no tactile) variant. Train this first; config/deco_vitac2026_tactile.yaml's plugin
# adapter is fine-tuned on top of this checkpoint (`pretrain_model_path`).
model_name: deco_vitac
data_format: lerobot   # read via lerobot_dataset.py instead of the original dataset.py

model:
  action_dim: 20             # official 20D action (see PDF: per-arm 3D delta-xyz + 6D rotation delta + 1D absolute gripper width, x2)
  obs_dim: 20                 # official 20D state (per-arm 6D relative-to-episode-start pose + 1D gripper width, x2, + 6D inter-hand relative pose)
  chunk_size: 32               # K=32, matches the official replay/chunking convention (~1.07s at 30fps)
  obs_state: True
  use_tactile: False
  plugin: False
  plugin_rank: 32
  use_language_condition: True # condition on the task prompt instead of a one-hot task index
  lang_embed_dim: 384          # sentence-transformers/all-MiniLM-L6-v2 output dim
  tactile_pool_size: 2         # unused when use_tactile=False, kept for symmetry with the tactile config
  tactile_t_hist: 1
  num_attn_blocks: 6
  inf_step: 5
  heads: 8
  dim: 512
  rope_axes_dim: [256, 256]
  img_pretrain: /root/.cache/torch/hub/checkpoints/resnet34-b627a593.pth
  freeze_backbone: False
  pretrain_model_path: False
  adapter_model_path: False

# Dataset location + split. Point `root` at a local v3.0 dataset directory (run
# lerobot.scripts.convert_dataset_v21_to_v30 once on the officially-released v2.1 shards
# first -- see utils/cal_mean_std_lerobot.py's docstring), or leave it null to stream from
# the HF Hub via `repo_id`.
dataset:
  repo_id: KaiyueChen/black_smash_03
  root: null
  val_ratio: 0.1
  split_seed: 42
  lang_embed_cache: ./assets/lang_embeddings/black_smash_03.json  # built by utils/cal_text_embeddings.py

data:
  chunk_size: 32
  norm_type: mean_std
